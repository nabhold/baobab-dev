# ==============================================================================
# BAOBAB Development Container
# ==============================================================================
#
# File
# ----
# zensical.toml
#
# Purpose
# -------
# Configures the BAOBAB Development Container documentation site.
#
# Documentation is authored in Markdown under the 'docs/' directory and is
# rendered into a static website using the Material theme.
#
# The generated site is automatically deployed to GitHub Pages through the
# GitHub Actions workflow located at:
#
#     .github/workflows/pages.yml
#
# Documentation Source
# --------------------
# docs/
#

[project]
site_url = "https://nabhold.github.io/baobab-dev/"
site_name = "BAOBAB"
site_description = "Enterprise-grade, reproducible development environment for the BAOBAB Enterprise Platform."
site_author = "Nabhold Group Africa"

copyright = "Copyright &copy; 2026 Nabhold Group Africa | Licensed under the Apache 2.0 License"

repo_url = "https://github.com/nabhold/baobab-dev"
repo_name = "nabhold/baobab-dev"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Introduction" = [
    "introduction/overview.md",
     "introduction/key-features.md", 
     "introduction/supported-platforms.md" 
    ]},
  { "Usage" = "usage/index.md" },
  { "Architecture" = "architecture/index.md" },
  { "Reference" = "reference/index.md" },
  { "Project" = "project/index.md" },
  { "Appendix" = "appendix/index.md" },
  { "Markdown Guide" = "markdown.md" },
]

extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascripts/extra.js"]

[project.theme]
variant = "classic"
custom_dir = "overrides"
favicon = "assets/images/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

logo = "assets/images/logo.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}

[project.extra]
generator = false