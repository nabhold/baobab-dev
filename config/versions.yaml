# ==============================================================================
# BAOBAB Enterprise Platform
# Development Container Version Manifest
#
# File: config/versions.yaml
#
# Purpose
# -------
# Single source of truth for all software versions installed by the BAOBAB
# Development Container.
#
# Notes
# -----
# • Edit only this file when upgrading software.
# • resolve.sh reads this file and generates versions.lock.
# • The Dockerfile consumes versions.lock.
# ==============================================================================

manifest:
  schema: "1.0"
  name: "BAOBAB Development Container"
  description: "Version manifest for the BAOBAB DevContainer"

platform:
  ubuntu:
    version: "26.04"

languages:

  python:
    version: "3.14.6"
    source: "python.org"

  node:
    major: "24"
    source: "nodesource"

  flutter:
    version: "latest"
    channel: "stable"
    source: "flutter"

  java:
    version: "17"
    source: "apt"
    # OpenJDK 17 (JDK, not JRE), via Eclipse Temurin's own apt repository —
    # NOT Ubuntu's own openjdk-17-jdk package. Same reasoning already applied
    # to docker/postgresql below: an upstream-maintained apt repo keeps the
    # exact vendor/build consistent across Ubuntu base-image upgrades, rather
    # than whatever OpenJDK build Ubuntu's own archive happens to carry for a
    # given release. Adoptium publishes Temurin for both amd64 and arm64
    # through this same repository (confirmed via their own multi-arch
    # Docker images) — no per-arch checksum pair needed here, unlike the
    # GitHub-release binaries under utilities/security below.
    #
    # Needed for baobab-erp's iDempiere ERP engine (github.com/nabhold/
    # baobab-erp) — iDempiere's own docs (wiki.idempiere.org/en/
    # Install_Prerequisites, live-verified 2026-09-01) require a JDK
    # (explicitly not JRE-only — "openjdk-17-jre is not sufficient because
    # it doesn't have the jar command used in some scripts"), OpenJDK 17 or
    # later, LTS preferred. "17" here means major version only, resolved the
    # same way postgresql.major is below — apt's own dependency resolution
    # picks the exact point release, not this file.

database:

  postgresql:
    major: "17"
    source: "apt"

package_managers:

  uv:
    version: "latest"
    source: "github"

  poetry:
    version: "latest"
    source: "github"

  pnpm:
    version: "latest"
    source: "npm"

  npm:
    version: "latest"
    source: "npm"
    # The Node.js-bundled npm CLI itself, upgraded in-place in the Dockerfile
    # (`npm install -g npm@${NPM_VERSION}`) rather than left at whatever
    # version ships with the resolved Node major. Resolved once here, not
    # left floating to `npm install -g npm@latest` at build time — see the
    # Dockerfile CHANGE LOG entry dated 2026-08-28: floating `@latest`
    # in-Dockerfile failed on a bad upstream npm-registry publish, so both
    # npm and its bundled tar (below) are now resolved through this file
    # like every other tool, and fail the lockfile step instead of the
    # build step if the registry is broken.

  npm_bundled_tar:
    version: "latest"
    source: "npm"
    # NOT the system `tar` binary (apt-managed) — this is the `tar` npm
    # package bundled inside npm's own node_modules, upgraded in-place for
    # tar's own CVE fixes (see Dockerfile CHANGE LOG: CVE-2026-59873/
    # CVE-2026-73566). Floats to "latest" for the same CVE-freshness reason
    # npm itself does; resolved once here, not at Docker build time.

utilities:

  task:
    version: "latest"
    source: "github"

  ripgrep:
    version: "latest"
    source: "github"

  fd:
    version: "latest"
    source: "github"

  bat:
    version: "latest"
    source: "github"

  eza:
    version: "latest"
    source: "github"

  jq:
    version: "system"
    source: "apt"

  yq:
    version: "latest"
    source: "github"

  fzf:
    version: "system"
    source: "apt"

  tree:
    version: "system"
    source: "apt"

  unzip:
    version: "system"
    source: "apt"

  zip:
    version: "system"
    source: "apt"

  xz:
    version: "system"
    source: "apt"

development:

  docker:
    version: "latest"
    source: "docker"

  github_cli:
    version: "latest"
    source: "github"

  maven:
    version: "3.9.16"
    source: "apache"
    # Explicit pin, NOT "latest" — unlike almost every other GitHub/npm-sourced
    # tool in this file. Maven Central's own maven-metadata.xml currently
    # resolves <latest>/<release> to 4.0.0-rc-6 (a pre-release of an
    # in-development major version), which would silently pull an
    # incompatible, non-GA toolchain into every build. iDempiere's own build
    # requires the Maven 3.9.x line specifically (wiki.idempiere.org, see the
    # java entry above) — 3.9.16 is the latest GA release on that line at
    # authoring time (2026-09-01).
    #
    # Distribution is the official Apache tarball, architecture-independent
    # (pure Java — no per-arch binary, unlike the Temurin JDK above), fetched
    # from archive.apache.org (not dlcdn.apache.org, which only mirrors the
    # single current release and would break reproducibility once 3.9.16 is
    # superseded) at:
    #   https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz
    # Verified via the matching Apache-published `.sha512` sidecar (Apache
    # publishes SHA-512 for Maven releases, not SHA-256 — see resolve.sh),
    # per this repo's Zero-Trust Binary Downloads convention.

# ------------------------------------------------------------------------------
# NEW — frontend_tooling
#
# Backs the `frontend` and `frontend-e2e` Dockerfile build targets (ADR-0001,
# nabhold/shared) and the `frontend` profile in the development-environment
# contract schema. Follows this file's own established convention: "latest",
# resolved to an exact version by resolve.sh into versions.lock at build
# time — NOT hardcoded here, for the same reason pnpm/uv/poetry above aren't.
#
# `stage` marks which Dockerfile target installs each tool, since (unlike
# every other domain in this file) not all of these belong in the same
# build stage:
#   frontend      -> Node/pnpm/Turborepo only, no browser binaries
#   frontend-e2e  -> extends frontend, adds Playwright's browser download +
#                    Sharp (native libvips binding) + Lighthouse (reuses
#                    Playwright's Chromium, per ADR-0001's brainstorm — no
#                    second browser install)
#
# Verified as real, currently-published packages at authoring time
# (2026-08-26): turbo 2.10.12, playwright 1.62.1, sharp 0.35.4,
# lighthouse 13.4.1. Not pinned to these numbers — see note above.
# ------------------------------------------------------------------------------

frontend_tooling:

  turbo:
    version: "latest"
    source: "npm"
    stage: "frontend"

  playwright:
    version: "latest"
    source: "npm"
    stage: "frontend-e2e"
    note: "Installs its own browser binaries (Chromium/Firefox/WebKit) — this is the highest CVE-surface addition in this domain, expect its own hardening cycle."

  sharp:
    version: "latest"
    source: "npm"
    stage: "frontend-e2e"
    note: "Native libvips binding — verify arm64 prebuilt binary availability during hardening, not just amd64."

  lighthouse:
    version: "latest"
    source: "npm"
    stage: "frontend-e2e"
    note: "Reuses Playwright's Chromium — does not install a second browser."

security:

  cosign:
    version: "latest"
    source: "github"