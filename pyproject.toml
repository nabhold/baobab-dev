# ==============================================================================
# BAOBAB Development Container
# ==============================================================================
#
# Project Configuration
#
# This file defines the Python project metadata and dependency groups used by
# the BAOBAB Development Container.
#
# Although this repository is not a distributable Python package, Python is
# used to support project tooling such as documentation generation, local
# testing, validation, and automation.
#
# Dependency Management
# ---------------------
#
# Dependencies are managed exclusively with:
#
#     uv
#
# A deterministic dependency graph is stored in:
#
#     uv.lock
#
# Contributors should never edit uv.lock manually.
# Whenever this file changes, regenerate the lock file:
#
#     uv lock
#
# Commit both files together:
#
#     pyproject.toml
#     uv.lock
#
# Dependency Groups
# -----------------
#
# dev   Local test/tooling harness (pytest, plus pyyaml/requests for
#       prototyping and validating things like checksum verification against
#       upstream sources before that logic is ported into resolve.sh / the
#       Dockerfile). Installed with:
#
#           uv sync --locked --group dev
#           uv run --group dev pytest
#
# docs  Zensical static site generator for the documentation site. GitHub
#       Actions installs only this group for the Pages publish workflow:
#
#           uv sync --locked --group docs
#
# ==============================================================================

[project]
name = "baobab-devcontainer"
version = "0.1.0"
description = "Enterprise-grade, reproducible development container for the BAOBAB Enterprise Platform."
readme = "README.md"

# Matches config/versions.yaml's pinned languages.python.version (3.14.x) —
# the same version the container itself ships. Keep these in sync by hand,
# the same way UBUNTU_VERSION is kept in sync between versions.yaml and the
# Dockerfile's ARG default.

requires-python = ">=3.14"

license = { file = "LICENSE" }

authors = [
    { name = "Nabhold" }
]

keywords = [
    "devcontainer",
    "docker",
    "codespaces",
    "github-pages",
    "infrastructure",
    "zensical",
    "automation",
    "development",
    "container"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development",
]

# ------------------------------------------------------------------------------
# Project URLs
# ------------------------------------------------------------------------------

[project.urls]
Homepage = "https://github.com/nabhold/baobab-dev"
Repository = "https://github.com/nabhold/baobab-dev"
Documentation = "https://nabhold.github.io/baobab-dev/"
Issues = "https://github.com/nabhold/baobab-dev/issues"
Releases = "https://github.com/nabhold/baobab-dev/releases"
Changelog = "https://github.com/nabhold/baobab-dev/blob/main/CHANGELOG.md"

# ------------------------------------------------------------------------------
# Dependency Groups
#
# Separate dependency groups allow tooling to be installed only when required.
# The GitHub Pages workflow installs only the 'docs' group.
# ------------------------------------------------------------------------------

[dependency-groups]

dev = [
    # --------------------------------------------------------------------------
    # Local test harness
    # --------------------------------------------------------------------------
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    # --------------------------------------------------------------------------
    # Parsing config/versions.yaml when testing resolve.sh's output
    # --------------------------------------------------------------------------
    "pyyaml>=6.0,<7.0",
    # --------------------------------------------------------------------------
    # Prototyping/validating checksum + version lookups against GitHub
    # Releases and Flutter's release manifest before that logic is ported
    # into resolve.sh / the Dockerfile
    # --------------------------------------------------------------------------
    "requests>=2.32,<3.0",
    "zensical>=0.0.53",
]

docs = [
    "zensical>=0.0.53",
]

# ------------------------------------------------------------------------------
# Future Dependency Groups
#
# These groups are intentionally omitted until they are required.
#
# Examples:
#
# lint
# spell
# links
#
# Keeping the project minimal reduces maintenance overhead.
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# pytest Configuration
# ------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

# ------------------------------------------------------------------------------
# uv Configuration
# ------------------------------------------------------------------------------

[tool.uv]

# This repository is infrastructure rather than a distributable Python package.
package = false
