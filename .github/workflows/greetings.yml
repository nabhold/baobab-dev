# ==============================================================================
# BAOBAB Enterprise Platform
# Greet First-Time Contributors
#
# File: .github/workflows/greetings.yml
#
# PURPOSE:
#   Owns the trigger and the elevated issues/pull-requests permissions;
#   delegates the greeting mechanism itself to nabhold/shared, per this
#   org's "build common capabilities once, govern centrally" principle. A
#   reusable workflow cannot declare its own repository-event trigger
#   (only workflow_call), so this thin wrapper is the only place
#   pull_request_target / issues live for this repo.
#
# WHY pull_request_target is safe here: this job never checks out the PR's
# own code (no `actions/checkout` step in this file), so a malicious fork
# PR has no code-execution surface despite the base-repo token permissions.
# ==============================================================================

name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  greeting:
    permissions:
      issues: write
      pull-requests: write
    # SHA is nabhold/shared's v1.0.0 tag (annotated tag — this is the
    # peeled commit, not the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/nabhold/shared.git v1.0.0`
    # on 2026-08-25. Future nabhold/shared releases should flow through
    # Dependabot from here (see .github/dependabot.yml's github-actions
    # entry) — but re-verify manually on the first bump PR regardless,
    # since Dependabot has a documented issue (dependabot-core#14716)
    # resolving updates correctly the first time a previously-untagged
    # pin moves onto an actual tag.
    uses: nabhold/shared/.github/workflows/greetings.yml@ad5cdb028023cd6b9c48cd8d7e6151ef4ab0cd73 # v1.0.0
    with:
      issue-message: |
        👋 Thanks for opening your first issue in **BAOBAB Enterprise Platform**!

        A maintainer will take a look shortly. In the meantime, if this is a bug
        report, a repro (image tag, architecture, and the exact command that
        failed) will help us get to a fix faster.
      pr-message: |
        🎉 Thanks for your first pull request to **BAOBAB Enterprise Platform**!

        A maintainer will review it soon. If your change touches
        `.devcontainer/`, `config/`, or `scripts/`, note that `config/versions.lock`
        is generated exclusively by `config/resolve.sh` — please don't hand-edit it.

        See the [Contributing guide](https://nabhold.github.io/baobab-dev/project/contributing/)
        for more.