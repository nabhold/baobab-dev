# ==============================================================================
# BAOBAB Development Container
# Deploy Documentation
#
# File: .github/workflows/pages.yml
#
# PURPOSE:
#   Owns everything specific to THIS repository — trigger, path filters,
#   and deriving the pinned Python version from config/versions.yaml —
#   then delegates the generic uv+Zensical build/deploy mechanism to
#   nabhold/shared. See that repository's pages-zensical.yml for why
#   Python-version derivation is deliberately kept out of the shared
#   workflow.
#
# TWO-JOB SHAPE:
#   resolve-python-version runs first and calls shared's generic
#   derive-value-from-yaml composite action against THIS repo's
#   config/versions.yaml — the same targeted extraction the old inline
#   yq step did, now centrally maintained. Its output feeds the `docs`
#   job, a single `uses:` call into shared's pages-zensical.yml, which
#   expands into that workflow's own build -> deploy job graph.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Refactored onto nabhold/shared's pages-zensical.yml reusable workflow.
#   Build mechanics (checkout, uv, zensical build --clean, artifact
#   upload/deploy) now live centrally; only the parts genuinely specific
#   to this repository remain here.
# ==============================================================================

name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-python-version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA is nabhold/shared's v1.0.0 tag (annotated — this is the
      # peeled commit, not the tag object's own SHA), verified live via
      # `git ls-remote --tags https://github.com/nabhold/shared.git
      # v1.0.0` on 2026-08-25. See the same note in greetings.yml above
      # re: Dependabot and dependabot-core#14716.
      - id: resolve
        uses: nabhold/shared/.github/actions/derive-value-from-yaml@ad5cdb028023cd6b9c48cd8d7e6151ef4ab0cd73 # v1.0.0
        with:
          manifest-path: config/versions.yaml   # TODO: adjust if this repo's manifest differs
          query: ".languages.python.version"    # TODO: adjust query path if schema differs

  docs:
    needs: resolve-python-version
    permissions:
      contents: read
      pages: write
      id-token: write
    # Same pin/rationale as resolve-python-version's step above.
    uses: nabhold/shared/.github/workflows/pages-zensical.yml@ad5cdb028023cd6b9c48cd8d7e6151ef4ab0cd73 # v1.0.0
    with:
      python-version: ${{ needs.resolve-python-version.outputs.version }}