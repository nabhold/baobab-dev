# ==============================================================================
# BAOBAB Development Container
# Deploy Documentation
#
# File: .github/workflows/pages.yml
#
# PURPOSE:
#   Owns everything specific to THIS repository — trigger, path filters,
#   and deriving the pinned Python version from config/versions.yaml —
#   then delegates the generic uv+Zensical build/deploy mechanism to
#   nabhold/shared. See that repository's pages-zensical.yml for why
#   Python-version derivation is deliberately kept out of the shared
#   workflow.
#
# TWO-JOB SHAPE:
#   resolve-python-version runs first and calls shared's generic
#   derive-value-from-yaml composite action against THIS repo's
#   config/versions.yaml — the same targeted extraction the old inline
#   yq step did, now centrally maintained. Its output feeds the `docs`
#   job, a single `uses:` call into shared's pages-zensical.yml, which
#   expands into that workflow's own build -> deploy job graph.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Refactored onto nabhold/shared's pages-zensical.yml reusable workflow.
#   Build mechanics (checkout, uv, zensical build --clean, artifact
#   upload/deploy) now live centrally; only the parts genuinely specific
#   to this repository remain here.
# ==============================================================================

name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------------------------------------------
  # Repo-specific: derive the pinned Python version from THIS repo's
  # config/versions.yaml, via shared's generic yq-extraction composite
  # action — the one piece of the old inline implementation that could not
  # move into the shared reusable workflow itself.
  # ----------------------------------------------------------------------------
  resolve-python-version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.value }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: resolve
        uses: nabhold/shared/.github/actions/derive-value-from-yaml@v1
        with:
          manifest-path: config/versions.yaml
          query: ".languages.python.version"

  # ----------------------------------------------------------------------------
  # Generic: build + deploy via nabhold/shared's Zensical pipeline. This one
  # `uses:` entry expands to that workflow's full build -> deploy job graph;
  # the permissions below are the ceiling for BOTH jobs, not just this call.
  # ----------------------------------------------------------------------------
  docs:
    needs: resolve-python-version
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: nabhold/shared/.github/workflows/pages-zensical.yml@v1
    with:
      python-version: ${{ needs.resolve-python-version.outputs.version }}