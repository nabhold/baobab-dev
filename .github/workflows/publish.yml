# ==============================================================================
# BAOBAB Enterprise Platform — Container Publish, Attestation & Security Pipeline
# File: .github/workflows/publish.yml
#
# HIGHLIGHTS:
#   1. Actions pinned to 40-char commit SHAs (supply-chain tamper resistance).
#   2. Concurrency: cancels superseded PR/branch runs; never cancels main/tags.
#   3. Least privilege: global `contents: read`, elevated per job only.
#   4. Native Buildx SBOM (sbom: true) + SLSA provenance (provenance: true).
#   5. Trivy gate blocks release on unpatched CRITICAL/HIGH CVEs.
#   6. Keyless Cosign signing/attestation via GitHub OIDC — no static keys.
#      Cosign CLI v3.x since 2026-08-23 (see "Install Cosign CLI tool" below
#      for why this was a forced, non-optional major-version upgrade).
#   7. Tag-gated publish, shift-left security — see policies below.
#
# PUBLISH TRIGGER POLICY:
#   Build + Trivy gate run on every push/PR to `main`. Registry push,
#   signing, attestation, and GitHub Release wait for an actual `v*.*.*`
#   tag — a deliberate, reviewed release action, not a side effect of
#   merging to `main`. Every gating `if:` is `startsWith(github.ref,
#   'refs/tags/')` (never `github.event_name != 'pull_request'`, which
#   would also fire on `main` pushes) — see GHCR auth, the real build,
#   digest export/upload, and the smoke-test steps, plus the `publish`
#   job's own `if:`. Because `publish` only ever runs on a tag ref, its
#   `metadata-action` step needs no branch/sha tag patterns, and the
#   `latest` tag's `enable:` needs no extra tag-ref guard.
#
# SECURITY SCAN TRIGGER POLICY (shift-left):
#   The Trivy gate ("Build local single-manifest image for scanning"
#   through "Scan built container with Trivy") is DELIBERATELY NOT
#   tag-gated — it runs on every PR, `main` push, and tag push, so a bad
#   dependency or base-image bump is caught before merge, not at release
#   time. Added cost is minimal: it reuses the `type=gha` build cache and
#   the cached vulnerability DB. It still re-runs at tag time too, as
#   defense-in-depth against a CVE disclosed between merge and release.
#   Registry push, the real build's `push:` flag, digest export/upload,
#   the smoke test, and the whole `publish` job remain tag-gated.
#
# TRIVY CLI FLAGS (pinned TRIVY_VERSION=0.73.0):
#   `--pkg-types os,library` replaces the deprecated `--vuln-type`
#   (renamed in Trivy v0.54.0: aquasecurity/trivy#7268). `--scanners
#   vuln,secret` is explicit rather than relying on Trivy's current
#   default set. `--skip-db-update`/`--skip-java-db-update` are computed
#   dynamically by "Determine Trivy DB skip flags" (checked on disk, not
#   just cache-hit — a restore-keys prefix match populates the dir but
#   still reports cache-hit: false) because hardcoding either flag
#   breaks the very first run with "cannot be specified on the first
#   run". `--skip-files` exempts only `flutter_web_sdk/**/dart_sdk.js`
#   (~14-16MB compiled Flutter bundle) from SECRET scanning — it has no
#   effect on CVE coverage and only stops the secret scanner flagging a
#   large first-party bundle as "too large" (observed 2026-08-17).
#   `--skip-version-check` drops Trivy's own unrelated, unpinned
#   "newer CLI available" network check.
#
# TRIVY SCAN TARGET:
#   `sbom: true` + `provenance: true` make even a single-platform build
#   emit an OCI Image INDEX (real manifest + a separate "unknown/unknown"
#   attestation manifest) — documented BuildKit behavior (moby/buildkit,
#   docker/buildx#1964; also goharbor/harbor#22848, stacklok/dockyard#215).
#   Trivy can't resolve that index directly, so "Build local
#   single-manifest image for scanning" re-exports the same build with
#   `load: true` (no attestations, same builder/cache, nothing rebuilt)
#   purely as an unambiguous local scan target. The real published
#   artifact keeps its full SBOM + provenance untouched.
#
# PERFORMANCE:
#   Trivy's vulnerability DB (~500MB+) is cached via our own SHA-pinned
#   `actions/cache` call — trivy-action's bundled `actions/cache` isn't
#   SHA-pinned, so it's rejected by the org's action-pinning policy —
#   under a single day-scoped key shared by both matrix legs and every
#   trigger: the first scan anywhere in the repo each day pays the
#   download; every later PR/branch/tag scan that day reuses the cache.
# ==============================================================================

name: Publish Baobab Dev Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (optional)
        required: false
        default: ""

# Cancels superseded PR/branch runs to save CI time; never cancels a `main`
# or tag run, so production deploy tracks are never interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-dev

# Least-privilege default: global token rights are read-only; elevated only per job.
permissions:
  contents: read

jobs:

  # Job 1: Pre-flight Lockfile Integrity & Auto-Sync
  # Verifies config/versions.lock matches config/versions.yaml, auto-commits
  # drift on branches, and hard-fails drift on a tag push (see "Fail on
  # tag-push drift" below). Runs on every trigger — build always needs a
  # correct lockfile, whether or not this run ever publishes anything.
  sanity-check:
    name: Lockfile Integrity & Auto-Sync
    runs-on: ubuntu-26.04

    # `contents: write` — needed to auto-commit resolved lockfile changes on
    # branches (never on tag pushes; see "Fail on tag-push drift" below).
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pinned + checksummed (not "latest") per this project's binary-pinning
      # convention (config/resolve.sh). CI-bootstrap tooling only — parses
      # config/versions.yaml before versions.lock exists, so intentionally
      # decoupled from YQ_VERSION in versions.lock (the yq shipped inside the
      # image itself). Bump YQ_BOOTSTRAP_VERSION/_SHA256 by hand as needed.
      - name: Install yq dependency
        env:
          YQ_BOOTSTRAP_VERSION: "4.53.3"
          YQ_BOOTSTRAP_SHA256: "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_BOOTSTRAP_VERSION}/yq_linux_amd64"
          echo "${YQ_BOOTSTRAP_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          rm -f /tmp/yq

      - name: Verify lockfile integrity via resolve.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x config/resolve.sh
          ./config/resolve.sh

      - name: Check for lockfile drift
        id: drift-check
        run: |
          if git diff --quiet -- config/versions.lock .python-version; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # Auto-commit resolved lockfile changes — BRANCHES ONLY. A tag is an
      # immutable pointer to an already-reviewed commit; pushing a new commit
      # "onto" a tag either fails outright or silently moves the tag and
      # invalidates anything already signed/attested. See "Fail on tag-push
      # drift" below for the tag-push case.
      - name: Auto-commit resolved lockfile changes (branches only)
        id: auto-commit
        if: steps.drift-check.outputs.drift == 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: stefanzweifel/git-auto-commit-action@8756aa072ef5b4a080af5dc8fef36c5d586e521d # v5.0.0
        with:
          commit_message: "chore(deps): auto-update versions.lock and .python-version via resolve.sh [skip ci]"
          file_pattern: "config/versions.lock .python-version"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      # Fail on tag-push drift: there's no branch to auto-commit to on a tag
      # push, and there shouldn't be one — a release tag must be built from a
      # lockfile that was already committed and reviewed. A mismatch here is
      # a real discrepancy between versions.yaml and what this release claims
      # to ship, so stop and force a human to reconcile it.
      - name: Fail on tag-push drift
        if: steps.drift-check.outputs.drift == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error:: config/versions.lock is out of date with config/versions.yaml on tag '${{ github.ref_name }}'."
          echo "::error:: Release tags must be immutable and built from a lockfile that was already committed and reviewed."
          echo "::error:: Run config/resolve.sh locally (or via .github/workflows/update-lockfile.yml), commit the result via a normal PR, then re-cut this tag."
          exit 1

      - name: Enforce pull request branch workflow on auto-commit failure
        if: failure() && steps.auto-commit.outcome == 'failure'
        run: |
          echo "::error:: Lockfile drift detected, but auto-commit failed."
          echo "::error:: Direct pushes to '${{ github.ref_name }}' may be restricted by branch protection."
          echo "::error:: Please execute resolve.sh locally or update via a Pull Request branch."
          exit 1

      # Hand off the freshly-resolved lockfile via artifact, not the
      # auto-commit above: build's checkout later in this run is pinned to
      # github.sha (the commit that TRIGGERED this run), which can never see
      # a commit sanity-check makes during its own execution — only a FUTURE
      # run would. Without this hand-off, any run with genuine drift fails
      # build's Dockerfile COPY with "versions.lock: not found" (confirmed
      # via a real failed run). Uploaded unconditionally — pull_request
      # builds never reach the auto-commit step but still need a lockfile.
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-lockfile
          path: |
            config/versions.lock
            .python-version
          if-no-files-found: error
          retention-days: 1

  # Job 2: Multi-Arch Container Build & Vulnerability Scan Gate
  # Builds amd64/arm64 images and runs the Trivy CVE/secret gate on every
  # push and PR (see "SECURITY SCAN TRIGGER POLICY" above). Only on a
  # `v*.*.*` tag push does it also push the real image to GHCR (with SBOM +
  # SLSA provenance embedded) and smoke-test it (see "PUBLISH TRIGGER
  # POLICY" above).
  build:
    name: Build & Security Scan (${{ matrix.platform }})
    needs: sanity-check

    # RATIONALE: Route arm64 builds to native ARM GitHub-hosted runners for faster performance.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    # `packages: write` — needed to push image layers/metadata by digest.
    # Granted job-wide (GitHub Actions has no per-step scoping); only
    # exercised on tag pushes.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    # Read directly by the trivy binary (every Trivy flag has a
    # TRIVY_<FLAG> env equivalent). Set once here so "Cache Trivy
    # vulnerability database" and `trivy image` agree on the same path.
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Overwrites whatever versions.lock the checkout brought in with the
      # exact one sanity-check resolved earlier in THIS run (see "Upload
      # resolved lockfile" in sanity-check for why).
      - name: Download resolved lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-lockfile
          path: .

      # - name: Setup QEMU Emulation
      # uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # Only needed to PUSH — an unauthenticated build can still pull the
      # public base image and read the GHA cache, so PR/branch validation
      # builds (which never push) skip this login entirely.
      - name: Authenticate to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract OCI Metadata & Labels
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build image with native Buildx SBOM & SLSA Provenance
      #   sbom: true          — SPDX Software Bill of Materials
      #   provenance: true    — SLSA Level 3 build provenance, embedded
      #   push-by-digest      — pushes layers without touching tags yet
      #   push: only true on a tag push (see PUBLISH TRIGGER POLICY above);
      #     PR/`main` runs exercise the identical build with push disabled,
      #     so a build failure surfaces before a tag is ever cut.
      - name: Build container image with SBOM & SLSA Provenance
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          sbom: true
          # Instruct BuildKit to emit SLSA v1.0 schema inside the in-toto predicate
          provenance: mode=max,version=v1

      # DEBUG: confirms BuildKit generated provenance at build time, before any merge step touches it.
      - name: Debug — inspect provenance immediately after build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::group::buildx version (build job)"
          docker buildx version
          echo "::endgroup::"
          echo "::group::Provenance for ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            --format '{{ json . }}' | jq '.'
          echo "::endgroup::"
      
      # Export each arch's digest to a file, then upload as its own artifact
      # (Docker's documented "distribute build across runners" pattern).
      # Matrix job `outputs:` don't reliably survive across legs — depending
      # on completion order, `needs.build.outputs.*` can silently drop one
      # architecture. Tag-gated: nothing was pushed by digest on a PR/branch
      # validation build, so there's nothing to export.
      - name: Export architecture image digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Build local single-manifest image for scanning
      # See "TRIVY SCAN TARGET" above: the real push-by-digest build (with
      # sbom/provenance) produces a 2-manifest OCI index Trivy can't resolve
      # directly. This re-exports the identical build — same builder/cache,
      # nothing rebuilt — with `load: true` and no attestations, purely as
      # an unambiguous local scan target. Runs on EVERY trigger (not
      # tag-gated) since it only feeds the equally un-gated Trivy step
      # below; `load: true` never touches GHCR, so no registry auth needed.
      - name: Build local single-manifest image for scanning
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: baobab-dev:scan
          cache-from: type=gha,scope=${{ matrix.platform }}

      # Cache Trivy vulnerability database
      # Trivy re-downloads its ~500MB+ DB on every scan by default.
      # trivy-action's own bundled `actions/cache` isn't SHA-pinned (fails
      # the org's action-pinning policy), so this uses our own SHA-pinned
      # `actions/cache` call instead. One day-scoped key
      # (`cache-trivy-<date>`, `cache-trivy-` restore-key prefix) is shared
      # across BOTH matrix legs AND every trigger (PR/branch/tag) — the DB
      # isn't architecture-specific, so whichever leg or trigger runs first
      # each day populates the cache everything else that day reuses.
      - name: Determine cache date
        id: cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: cache-trivy-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            cache-trivy-

      # Determine Trivy DB skip flags
      # Unconditionally passing --skip-db-update/--skip-java-db-update
      # breaks the very first run (or any genuine cache miss) with "cannot
      # be specified on the first run" — there's no local DB yet to skip.
      # This checks what actually landed on disk (not just the cache
      # step's hit/miss verdict — a restore-keys prefix match still
      # populates the dir while reporting cache-hit: false) and only emits
      # the flag for a DB that's genuinely present. Output feeds the Trivy
      # step below via env var, so an empty result contributes zero words.
      - name: Determine Trivy DB skip flags
        id: trivy-db-cache-state
        run: |
          set -euo pipefail
          SKIP_FLAGS=""

          if [ -d "${TRIVY_CACHE_DIR}/db" ] && \
             [ -n "$(find "${TRIVY_CACHE_DIR}/db" -type f -print -quit 2>/dev/null)" ]; then
            SKIP_FLAGS="${SKIP_FLAGS} --skip-db-update"
          fi

          if [ -d "${TRIVY_CACHE_DIR}/java-db" ] && \
             [ -n "$(find "${TRIVY_CACHE_DIR}/java-db" -type f -print -quit 2>/dev/null)" ]; then
            SKIP_FLAGS="${SKIP_FLAGS} --skip-java-db-update"
          fi

          echo "flags=${SKIP_FLAGS}" >> "$GITHUB_OUTPUT"

      # Security Vulnerability Gate (Trivy)
      # Scans for OS/library CVEs; exits 1 on unpatched HIGH/CRITICAL,
      # blocking publish. Installed via a direct checksummed download
      # rather than aquasecurity/trivy-action: that composite action calls
      # aquasecurity/setup-trivy and actions/cache pinned by TAG in its own
      # source — outside this file's control, and rejected by the org's
      # "actions pinned to full commit SHA" policy transitively (confirmed
      # via a real failed run). A plain `run:` step has no `uses:` for that
      # policy to reject, and matches the checksummed-download pattern used
      # throughout this project. SHA256s below are from Trivy's own
      # checksums.txt (GitHub's release-asset digest API was rate-limited
      # at verification time; live-verified via a full download+sha256sum).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux/amd64) ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; SHA256="2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b" ;;
            linux/arm64) ASSET="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; SHA256="13833d97e8a1a5367471c372a173180157f593bece570e20d5d925fef552f5dd" ;;
            *) echo "::error::Unsupported platform ${{ matrix.platform }} for Trivy install"; exit 1 ;;
          esac

          curl -fsSL -o "${ASSET}" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" trivy
          chmod +x trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      # Flags (Trivy 0.73.0): `--pkg-types` replaces deprecated
      # `--vuln-type` (renamed v0.54.0). `--scanners vuln,secret` is
      # explicit rather than relying on Trivy's default set. Skip flags
      # come from `${TRIVY_SKIP_FLAGS}` (never hardcoded — see "Determine
      # Trivy DB skip flags" above). `--skip-version-check` drops Trivy's
      # own unrelated network check. Scan target is the LOCAL
      # `baobab-dev:scan` image, not the registry digest — see "TRIVY SCAN
      # TARGET" above; no `--platform` needed since a local single-manifest
      # image has nothing to disambiguate. Not tag-gated (see "SECURITY
      # SCAN TRIGGER POLICY" above): this is now the primary gate on every
      # PR/`main` push, with the tag push re-running it as defense-in-depth.
      - name: Scan built container with Trivy
        env:
          # Read via shell var (not interpolated inline) so an empty value contributes zero words, not a blank arg.
          TRIVY_SKIP_FLAGS: ${{ steps.trivy-db-cache-state.outputs.flags }}
        run: |
          trivy image \
            --scanners vuln,secret \
            ${TRIVY_SKIP_FLAGS} \
            --skip-files "**/corepack/**,**/cacache/**,**/flutter_web_sdk/**/dart_sdk.js,**/devtools/**" \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-version-check \
            --format table \
            baobab-dev:scan

      # Container Smoke Test
      # Verifies basic runtime health before publishing. Still tag-gated
      # (unlike Trivy above): `steps.build.outputs.digest` only resolves to
      # something pullable once the real build's `push:` is true, i.e. on a
      # tag push. Tests the actual to-be-published image, not the local
      # `baobab-dev:scan` image Trivy scans.
      - name: Execute container smoke test
        if: matrix.platform == 'linux/amd64' && startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            baobab-verify

  # Job 3: Manifest Creation, OIDC Cosign Signing & Release Attestation
  # Merges per-arch images into a multi-arch OCI index, applies keyless
  # Cosign signatures/attestations via OIDC, and creates a GitHub Release.
  # Gated to `v*.*.*` tag pushes only (see PUBLISH TRIGGER POLICY above).
  publish:
    name: Publish Multi-Arch Manifest & Cosign Sign
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-24.04

    # contents: write — create the GitHub Release. packages: write —
    # publish the multi-arch OCI index. id-token: write — CRITICAL for
    # keyless Cosign signing via GitHub OIDC.
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same reasoning as build's identical step: this job's checkout is
      # pinned to github.sha and can't see sanity-check's own-run commit.
      # Needed so "Create GitHub Release" has versions.lock to attach.
      - name: Download resolved lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-lockfile
          path: .

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only semver + `latest` patterns are needed: this job's `if:` above
      # already guarantees a `v*.*.*` tag, so branch/sha tag types would
      # never match, and `latest`'s `enable:` needs no extra tag-ref guard.

      # FIX: publish job previously had no Buildx setup, relying on the runner's older bundled buildx CLI for imagetools create/inspect — the likely cause of missing provenance in the merged index.
      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Extract Docker tagging metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # Download per-architecture digests exported by the build job.
      # merge-multiple: true flattens both digests-* artifacts into one dir,
      # so each filename in ${{ runner.temp }}/digests IS one arch's raw
      # sha256 (see "Export architecture image digest" in the build job).
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # Merge per-architecture digests into a unified multi-arch OCI index.
      - name: Publish multi-architecture OCI manifest
        id: create-manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && TAG_ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          DIGEST_ARGS=()
          for f in "${{ runner.temp }}/digests"/*; do
            DIGEST_ARGS+=("${IMG}@sha256:$(basename "$f")")
          done

          # Guard against a silently incomplete manifest: fail loudly rather
          # than publishing a "multi-arch" image that only actually supports
          # one architecture.
          if [[ ${#DIGEST_ARGS[@]} -lt 2 ]]; then
            echo "::error:: Expected 2 architecture digests (amd64 + arm64), found ${#DIGEST_ARGS[@]}."
            echo "::error:: Check the 'build' job's per-platform 'Upload digest' steps."
            exit 1
          fi

          # Combine amd64 and arm64 digest layers into a single tag
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${DIGEST_ARGS[@]}"

          # Retrieve final OCI index manifest digest for cryptographic signing
          FIRST_TAG=$(echo "${TAGS}" | head -n1)
          DIGEST=$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # DEBUG: confirms provenance survives the imagetools create merge, now that publish has its own buildx.
      - name: Debug — inspect merged manifest before extracting provenance
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          echo "::group::buildx version (publish job)"
          docker buildx version
          echo "::endgroup::"
          echo "::group::Full imagetools inspect of merged index"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --format '{{ json . }}' | jq '.'
          echo "::endgroup::"
      # NEW: crane (google/go-containerregistry) fetches raw OCI blobs by digest — buildx has no equivalent, and it's the tool Docker's own docs use for the manual attestation-extraction workaround (docker/docs#23366).
      - name: Install crane CLI tool
        env:
          CRANE_VERSION: "0.21.9"
          CRANE_SHA256: "5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
        run: |
          set -euo pipefail
          ASSET="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL -o "${ASSET}" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${ASSET}"
          echo "${CRANE_SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" crane
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version
      # Extract per-platform SLSA provenance predicates
      # BuildKit already computed a full, genuine SLSA v1 predicate per
      # platform in the `build` job (`provenance: true`); it's embedded,
      # unsigned, in the OCI index `imagetools create` just merged. This
      # step extracts exactly that — no new content invented — so the
      # "Attest container image provenance" step below signs REAL build
      # data. cosign has no visibility into BuildKit's native embedded
      # attestation (different OCI convention than cosign's own
      # `sha256-<digest>.att`; `cosign download attestation` 404s against
      # it), so `docker buildx imagetools inspect` is the only way to hand
      # that content to cosign. Provenance is keyed per-platform
      # (`.Provenance["linux/amd64"]`, `["linux/arm64"]`) with no single
      # combined predicate, hence two predicate files and two DSSE
      # statements attested against the same multi-arch digest (cosign
      # appends rather than overwrites, so both coexist and either
      # satisfies scripts/verify-image.sh's check).
      # REWRITTEN: buildx's convenience `.Provenance` map came back empty for BOTH platforms after imagetools create (confirmed via the debug step above), even though the raw attestation manifests are present and correctly linked in the merged index — a known gap in the create+inspect roundtrip (see docker/docs#23366). This walks the raw OCI index manually — Docker's own documented workaround — to fetch each platform's REAL BuildKit-generated in-toto statement, preferring the SLSA v1.0 predicate layer and falling back to v0.2 only if v1 is genuinely absent. Never fabricates a predicate.
      - name: Extract per-platform SLSA provenance predicates
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          MANIFEST_JSON=$(docker buildx imagetools inspect "${IMG}@${DIGEST}" --format '{{ json .Manifest }}')

          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH="${PLATFORM#linux/}"
            FILE="provenance-$(basename "${PLATFORM}").json"
            TYPE_FILE="provenance-type-$(basename "${PLATFORM}").txt"

            # Locate this platform's own image-manifest digest within the merged index.
            IMAGE_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg arch "${ARCH}" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | .digest')

            if [[ -z "${IMAGE_DIGEST}" || "${IMAGE_DIGEST}" == "null" ]]; then
              echo "::error:: No image manifest found for ${PLATFORM} in the merged index ${IMG}@${DIGEST}."
              exit 1
            fi

            # Locate the sibling attestation-manifest that references this platform's image manifest.
            ATTESTATION_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg ref "${IMAGE_DIGEST}" \
              '.manifests[] | select(.annotations."vnd.docker.reference.type" == "attestation-manifest" and .annotations."vnd.docker.reference.digest" == $ref) | .digest')

            if [[ -z "${ATTESTATION_DIGEST}" || "${ATTESTATION_DIGEST}" == "null" ]]; then
              echo "::error:: No attestation manifest found for ${PLATFORM} (image digest ${IMAGE_DIGEST}) on ${IMG}@${DIGEST}."
              echo "::error:: Check the 'build' job's 'Build container image with SBOM & SLSA Provenance' step."
              exit 1
            fi

            ATTESTATION_RAW=$(docker buildx imagetools inspect "${IMG}@${ATTESTATION_DIGEST}" --raw)

            # Prefer the real SLSA v1.0 in-toto layer; fall back to v0.2 only if BuildKit genuinely didn't emit v1.
            PREDICATE_DIGEST=$(echo "${ATTESTATION_RAW}" | jq -r \
              '.layers[] | select(.annotations."in-toto.io/predicate-type" == "https://slsa.dev/provenance/v1") | .digest')
            PREDICATE_TYPE="slsaprovenance1"

            if [[ -z "${PREDICATE_DIGEST}" || "${PREDICATE_DIGEST}" == "null" ]]; then
              PREDICATE_DIGEST=$(echo "${ATTESTATION_RAW}" | jq -r \
                '.layers[] | select(.annotations."in-toto.io/predicate-type" == "https://slsa.dev/provenance/v0.2") | .digest')
              PREDICATE_TYPE="slsaprovenance"
              if [[ -n "${PREDICATE_DIGEST}" && "${PREDICATE_DIGEST}" != "null" ]]; then
                echo "::warning:: ${PLATFORM}: SLSA v1.0 provenance layer not found; falling back to v0.2."
              fi
            fi

            if [[ -z "${PREDICATE_DIGEST}" || "${PREDICATE_DIGEST}" == "null" ]]; then
              echo "::error:: No SLSA provenance layer (v1.0 or v0.2) found in attestation manifest ${IMG}@${ATTESTATION_DIGEST} for ${PLATFORM}."
              echo "::error:: Check the 'build' job's 'provenance: mode=max,version=v1' setting."
              exit 1
            fi

            # Fetch the real in-toto statement blob and isolate the SLSA predicate object.
            crane blob "${IMG}@${PREDICATE_DIGEST}" | jq '.predicate' > "${FILE}"
            echo "${PREDICATE_TYPE}" > "${TYPE_FILE}"

            if [[ ! -s "${FILE}" ]] || [[ "$(cat "${FILE}")" == "null" ]]; then
              echo "::error:: Fetched in-toto statement for ${PLATFORM} but its .predicate field was empty/null (blob ${PREDICATE_DIGEST})."
              exit 1
            fi
          done
      # Keyless OIDC Cosign Infrastructure
      # Installs Cosign; signs/attests via short-lived GitHub OIDC tokens
      # instead of long-lived static keys.
      #
      # UPGRADED (2026-08-23): cosign-installer v3.8.0 -> v4.1.2, forced by
      # a genuine version-scheme trap: v3.8.0 was the INSTALLER ACTION's own
      # version, not the cosign CLI's — sigstore/cosign-installer's own
      # release notes state "cosign-installer v3.x cannot be used to install
      # Cosign v3.x; you must upgrade to cosign-installer v4 in order to use
      # Cosign v3." This job had been running some cosign v2.x release the
      # whole time. --signing-config (needed for the Rekor v2 SBOM-attest
      # fix below) only exists from cosign v2.6.0 on, on-by-default from
      # v3.0 on — hence "unknown flag: --signing-config" on the old pin.
      #
      # No `cosign-release:` override: cosign-installer's own README
      # explicitly recommends AGAINST pinning a specific Cosign version
      # unless you have a specific reason to run an older one — one fewer
      # version to independently track. Dependabot's existing
      # `github-actions` ecosystem keeps this action's own SHA (and
      # therefore its bundled Cosign default) current and reviewable, which
      # already matches this project's "explicit, reviewed version bumps"
      # convention without a second manual pin.
      #
      # KNOWN OPEN RISK — WATCH THIS RUN: Cosign v3 defaults to storing
      # signatures/attestations as OCI 1.1 Referrers-API artifacts instead
      # of the legacy `sha256-<digest>.sig`/`.att` tag convention this
      # pipeline has relied on since v2.x. GHCR's OCI 1.1 Referrers API
      # support could not be confirmed with confidence — sources found
      # during this investigation conflict (some recent reports say GHCR
      # now supports read+write of referrers; other reports as recent as
      # mid-2025 say it does not). cosign v3.1.x's own verify commands
      # auto-detect old vs. new bundle format, so "Verify published image
      # signature & attestations" below should work either way IF the
      # referrer is discoverable at all — but if GHCR's referrers support is
      # genuinely partial, sign/attest could succeed while verification (or
      # a downstream consumer's `docker pull` + verify) silently can't find
      # what was written. If "Verify published image signature &
      # attestations" fails here in a way that looks like "nothing found"
      # rather than "invalid signature", this is the first thing to check —
      # `crane manifest`/`docker buildx imagetools inspect` on the digest to
      # confirm whether the referrer is actually listed.
      - name: Install Cosign CLI tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      
      # NEW: make the shared cosign-retry wrapper executable once, here — all three cosign-calling steps below depend on it.
      - name: Make cosign-retry.sh executable
        run: chmod +x scripts/cosign-retry.sh  

      # SIMPLIFIED: retry logic now lives in scripts/cosign-retry.sh, shared with the two attest steps below.
      - name: Sign container image via Keyless OIDC Identity
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          scripts/cosign-retry.sh cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "sha=${{ github.sha }}" \
            "${IMG}@${DIGEST}"
      # Attest container image provenance
      # Cosign-signs the two per-platform predicates extracted above (two
      # calls — see "Extract per-platform SLSA provenance predicates").
      # `-a`/`--annotation` is deliberately omitted here (unlike `cosign
      # sign` above): `cosign attest` doesn't accept it — confirmed absent
      # from `cosign attest`'s own flag list on both the old v2.x pin and
      # the current v3.1.x line ("unknown shorthand flag: 'a' in -a", hit
      # on the v1.0.0-rc.2 run that surfaced this investigation) — this is
      # not a version-specific gap. `--type slsaprovenance1`
      # (the v1 predicate shorthand) is deliberate, not cosmetic:
      # scripts/verify-image.sh's `cosign verify-attestation` resolves
      # plain `slsaprovenance` to the DIFFERENT v0.2 URI, so attesting
      # under v1 while verifying under the v0.2 alias would never match.
      # scripts/verify-image.sh has been updated to check
      # `--type slsaprovenance1` to match.
      # This step deliberately stays on cosign's default (TUF-distributed,
      # currently Rekor v1) signing config — it already succeeds; only the
      # SBOM attest step below needs the Rekor v2 override.
      # UPDATED: cosign needs the predicate type this run actually resolved per platform (v1, or the rare v0.2 fallback), read from the sidecar file the extraction step above wrote — no longer hardcoded to slsaprovenance1.
      # SIMPLIFIED: retry logic now lives in scripts/cosign-retry.sh, shared with sign and SBOM attest.
      - name: Attest container image provenance
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          for PLATFORM in linux/amd64 linux/arm64; do
            FILE="provenance-$(basename "${PLATFORM}").json"
            TYPE_FILE="provenance-type-$(basename "${PLATFORM}").txt"
            PREDICATE_TYPE="$(cat "${TYPE_FILE}")"

            scripts/cosign-retry.sh cosign attest --yes \
              --type "${PREDICATE_TYPE}" \
              --predicate "${FILE}" \
              "${IMG}@${DIGEST}"
          done
      # Extract & Attest SPDX SBOM
      # Same manual-extraction technique as SLSA provenance above — buildx's
      # `.SBOM` map has the identical create+inspect roundtrip gap as
      # `.Provenance` (sigstore/cosign#3030). BuildKit's SBOM layer uses
      # predicate type "https://spdx.dev/Document" exactly, with no
      # version-suffix ambiguity, so an exact match is safe here.
      - name: Extract per-platform SPDX SBOM predicates
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          MANIFEST_JSON=$(docker buildx imagetools inspect "${IMG}@${DIGEST}" --format '{{ json .Manifest }}')

          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH="${PLATFORM#linux/}"
            FILE="sbom-$(basename "${PLATFORM}").json"

            IMAGE_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg arch "${ARCH}" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | .digest')

            if [[ -z "${IMAGE_DIGEST}" || "${IMAGE_DIGEST}" == "null" ]]; then
              echo "::error:: No image manifest found for ${PLATFORM} in the merged index ${IMG}@${DIGEST}."
              exit 1
            fi

            ATTESTATION_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg ref "${IMAGE_DIGEST}" \
              '.manifests[] | select(.annotations."vnd.docker.reference.type" == "attestation-manifest" and .annotations."vnd.docker.reference.digest" == $ref) | .digest')

            if [[ -z "${ATTESTATION_DIGEST}" || "${ATTESTATION_DIGEST}" == "null" ]]; then
              echo "::error:: No attestation manifest found for ${PLATFORM} (image digest ${IMAGE_DIGEST}) on ${IMG}@${DIGEST}."
              exit 1
            fi

            ATTESTATION_RAW=$(docker buildx imagetools inspect "${IMG}@${ATTESTATION_DIGEST}" --raw)

            PREDICATE_DIGEST=$(echo "${ATTESTATION_RAW}" | jq -r \
              '.layers[] | select(.annotations."in-toto.io/predicate-type" == "https://spdx.dev/Document") | .digest')

            if [[ -z "${PREDICATE_DIGEST}" || "${PREDICATE_DIGEST}" == "null" ]]; then
              echo "::error:: No SPDX SBOM layer found in attestation manifest ${IMG}@${ATTESTATION_DIGEST} for ${PLATFORM}."
              echo "::error:: Check the 'build' job's 'sbom: true' setting."
              exit 1
            fi

            crane blob "${IMG}@${PREDICATE_DIGEST}" | jq '.predicate' > "${FILE}"

            if [[ ! -s "${FILE}" ]] || [[ "$(cat "${FILE}")" == "null" ]]; then
              echo "::error:: Fetched in-toto statement for ${PLATFORM} but its .predicate field was empty/null (blob ${PREDICATE_DIGEST})."
              exit 1
            fi
          done

      # ------------------------------------------------------------------------
      # DIAGNOSTIC (temporary — keeping deliberately, per 2026-08-23 decision:
      # relevant again once SBOM-trimming work starts, to compare before/after
      # sizes against this baseline: sbom-amd64.json ~26.6MB, sbom-arm64.json
      # ~26.7MB, both ~120x provenance-amd64.json/provenance-arm64.json's
      # ~223KB. This is the confirmed root cause of the original
      # "Attest container image SBOM" Rekor failure: Rekor v1 requires
      # uploading the ENTIRE DSSE-wrapped payload (sigstore/cosign#3599), and
      # a full-image SPDX SBOM this large gets rejected outright, while the
      # much smaller provenance predicate attests fine on the same log.)
      # ------------------------------------------------------------------------
      - name: "DIAGNOSTIC: report SBOM/provenance predicate sizes vs. Rekor's 100KB limit"
        run: |
          set -euo pipefail
          REKOR_V1_LIMIT_BYTES=102400  # 100KB — Rekor's documented public-instance attestation upload limit (empirically, the real ceiling for our failure sits somewhere between this and 26MB — see thread history for full analysis)

          {
            echo "### 🔍 DIAGNOSTIC — predicate payload sizes vs. Rekor's 100KB public-instance limit"
            echo ""
            echo "| File | Bytes | KB | Over 100KB limit? |"
            echo "|---|---|---|---|"
            for FILE in provenance-amd64.json provenance-arm64.json sbom-amd64.json sbom-arm64.json; do
              if [[ -f "${FILE}" ]]; then
                BYTES=$(wc -c < "${FILE}")
                KB=$(( BYTES / 1024 ))
                if (( BYTES > REKOR_V1_LIMIT_BYTES )); then
                  FLAG="⚠️ **YES**"
                else
                  FLAG="no"
                fi
                echo "| \`${FILE}\` | ${BYTES} | ${KB} | ${FLAG} |"
              else
                echo "| \`${FILE}\` | _not found_ | — | — |"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------
      # DIAGNOSTIC: SBOM structural breakdown (2026-08-23)
      # ------------------------------------------------------------------------
      # Answers the question the size-only diagnostic above couldn't: WHAT
      # is actually consuming the ~26MB in sbom-amd64.json, not just how big
      # it is. Reports package count by ecosystem (via purl scheme) with
      # per-ecosystem byte contribution, plus the individually largest
      # package entries. Deliberately does NOT delete or filter anything —
      # filtering packages out of an SPDX SBOM without first confirming
      # they're genuinely redundant (not just large) risks attesting a
      # document that misrepresents what's actually shipped, which is worse
      # than the current failure. This step exists to tell us which
      # situation we're actually in before anyone decides to trim anything.
      # Only sbom-amd64.json is analyzed — arm64's composition should mirror
      # it closely (same Dockerfile, same package set); re-run this step
      # against sbom-arm64.json by hand if amd64's breakdown looks
      # architecture-specific in a way that's surprising.
      - name: "DIAGNOSTIC: SBOM structural breakdown by ecosystem"
        run: |
          set -euo pipefail
          FILE="sbom-amd64.json"

          if [[ ! -f "${FILE}" ]]; then
            echo "::warning:: ${FILE} not found — skipping structural breakdown."
            exit 0
          fi

          TOTAL_PACKAGES=$(jq '(.packages // []) | length' "${FILE}")
          TOTAL_FILES=$(jq '(.files // []) | length' "${FILE}")
          TOTAL_RELATIONSHIPS=$(jq '(.relationships // []) | length' "${FILE}")

          # Per-package: [purl ecosystem scheme, serialized byte length of that package object].
          # "unknown" catches packages with no purl externalRef at all.
          jq -r '
            .packages[]? as $p
            | ( ($p.externalRefs // [])
                | map(select(.referenceType == "purl"))
                | (.[0].referenceLocator // "unknown")
              ) as $purl
            | ( if $purl == "unknown" then "unknown"
                else ($purl | capture("^pkg:(?<s>[^/]+)/").s? // "unknown")
                end
              ) as $scheme
            | [$scheme, ($p | tostring | length)] | @tsv
          ' "${FILE}" > /tmp/pkg-by-scheme.tsv

          # Aggregate: count + total bytes per ecosystem, sorted by bytes desc.
          BY_SCHEME=$(awk -F'\t' '
            { count[$1]++; bytes[$1]+=$2 }
            END { for (s in count) printf "%s\t%d\t%d\n", s, count[s], bytes[s] }
          ' /tmp/pkg-by-scheme.tsv | sort -t $'\t' -k3 -rn)

          # Individually largest package entries (catches outliers — e.g. one
          # entry with an unusually large embedded license/copyright blob —
          # separately from "which ecosystem has the most packages").
          TOP_PACKAGES=$(jq -r '
            .packages[]?
            | [ (. | tostring | length), .name, (.versionInfo // "?") ] | @tsv
          ' "${FILE}" | sort -rn | head -15)

          {
            echo "### 🔍 DIAGNOSTIC — SBOM structural breakdown (${FILE})"
            echo ""
            echo "**Totals:** ${TOTAL_PACKAGES} packages, ${TOTAL_FILES} file entries, ${TOTAL_RELATIONSHIPS} relationships"
            echo ""
            echo "#### By ecosystem (purl scheme)"
            echo ""
            echo "| Ecosystem | Package count | Total bytes | Avg bytes/pkg |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r scheme count bytes; do
              [[ -z "${scheme}" ]] && continue
              avg=$(( bytes / count ))
              echo "| \`${scheme}\` | ${count} | ${bytes} | ${avg} |"
            done <<< "${BY_SCHEME}"
            echo ""
            echo "#### 15 largest individual package entries"
            echo ""
            echo "| Bytes | Name | Version |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r bytes name version; do
              [[ -z "${bytes}" ]] && continue
              echo "| ${bytes} | \`${name}\` | \`${version}\` |"
            done <<< "${TOP_PACKAGES}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------
      # Rekor v2 signing config for the SBOM attestation only (2026-08-23)
      # ------------------------------------------------------------------------
      # Root cause confirmed via the diagnostic step above: this image's SPDX
      # SBOM predicate runs ~26MB, ~120x larger than the SLSA provenance
      # predicate (~223KB) that attests successfully against the same log.
      # Rekor v1 requires uploading the ENTIRE DSSE-wrapped payload
      # (sigstore/cosign#3599), and has a documented history of rejecting
      # very large attestations outright — matches our symptom exactly:
      # deterministic, every run, only on the oversized predicate.
      #
      # Rekor v2 fixes this at the protocol level: only a hash of the DSSE
      # envelope's pre-auth encoding is uploaded, never the full payload
      # (blog.sigstore.dev/rekor-v2-ga). The public sigstore.dev instance
      # doesn't distribute the Rekor v2 URL via TUF for SIGNING yet (only for
      # VERIFICATION), so opting in requires an explicit SigningConfig — per
      # Sigstore's own documented early-adopter path: take a copy of the live
      # TUF-distributed production SigningConfig and override only
      # `rekorTlogUrls` to add the v2 log ahead of the v1 log.
      #
      # PREREQUISITE: `cosign attest --signing-config` requires cosign
      # v2.6.0+ (default-on from v3.0+) — this is WHY "Install Cosign CLI
      # tool" above had to move off cosign-installer v3.x (which caps at
      # cosign v2.x) to v4.x. See that step's comment for the full story.
      #
      # DELIBERATELY SCOPED: only "Attest container image SBOM" gets
      # --signing-config. "Sign container image" and "Attest container image
      # provenance" already succeed against Rekor v1 — no reason to touch
      # working steps.
      #
      # WHY FETCHED LIVE, NOT COMMITTED: Sigstore explicitly warns the 2025
      # Rekor v2 instance (log2025-1.rekor.sigstore.dev) will be retired when
      # a 2026 instance replaces it, and advises against hardcoding the URL
      # into pipelines that can't be easily updated. Fetching
      # sigstore/root-signing's production signing_config.v0.2.json fresh on
      # every run means the Fulcio/OIDC/TSA sections never go stale — only
      # the Rekor v2 URL we inject below is a value we own and must revisit.
      #
      # CHECKPOINT: re-verify log2025-1.rekor.sigstore.dev is still current by
      # 2026-12-31. Check https://blog.sigstore.dev for a log-rotation
      # announcement, or inspect
      # https://github.com/sigstore/root-signing/blob/main/targets/signing_config.v0.2.json
      # directly — if TUF now distributes v2 as the default signing target,
      # this entire step becomes unnecessary and should be deleted.
      - name: Build Rekor v2 signing config for SBOM attestation
        run: |
          set -euo pipefail

          PRODUCTION_CONFIG_URL="https://raw.githubusercontent.com/sigstore/root-signing/main/targets/signing_config.v0.2.json"
          OUT_FILE="rekor-v2-signing-config.json"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            -o production-signing-config.json \
            "${PRODUCTION_CONFIG_URL}"

          # Fail loudly rather than silently proceeding on an unexpected
          # payload (e.g. GitHub serving an HTML error page instead of JSON,
          # or root-signing changing the SigningConfig schema).
          MEDIA_TYPE="$(jq -r '.mediaType // empty' production-signing-config.json)"
          if [[ "${MEDIA_TYPE}" != "application/vnd.dev.sigstore.signingconfig.v0.2+json" ]]; then
            echo "::error:: Fetched file from ${PRODUCTION_CONFIG_URL} does not look like a v0.2 Sigstore SigningConfig (mediaType='${MEDIA_TYPE}')."
            exit 1
          fi

          # Prepend the 2025 Rekor v2 log ahead of the existing v1 entry.
          # rekorTlogConfig.selector stays "ANY" (already set in the
          # production file), so cosign accepts an entry from either log.
          jq '.rekorTlogUrls = [{
                "url": "https://log2025-1.rekor.sigstore.dev",
                "majorApiVersion": 2,
                "validFor": { "start": "2025-10-06T00:00:00Z" },
                "operator": "sigstore.dev"
              }] + .rekorTlogUrls' \
            production-signing-config.json > "${OUT_FILE}"

          # Sanity-check the patch actually landed before trusting this file
          # for a real signing operation.
          V2_URL="$(jq -r '.rekorTlogUrls[0].url' "${OUT_FILE}")"
          V2_API_VERSION="$(jq -r '.rekorTlogUrls[0].majorApiVersion' "${OUT_FILE}")"
          if [[ "${V2_URL}" != "https://log2025-1.rekor.sigstore.dev" || "${V2_API_VERSION}" != "2" ]]; then
            echo "::error:: Rekor v2 entry missing or malformed after patching ${OUT_FILE}."
            exit 1
          fi

          echo "::notice:: Rekor v2 signing config ready: ${OUT_FILE} (rekorTlogUrls[0] = ${V2_URL}, v${V2_API_VERSION})"

      # Attest the two per-platform SPDX SBOMs extracted above, mirroring the provenance-attest step (cosign appends, so both attestations coexist on the same digest).
      # SIMPLIFIED: retry logic lives in scripts/cosign-retry.sh, shared with sign and provenance attest.
      # UPDATED (2026-08-23): --signing-config routes this attestation's
      # Rekor entry to Rekor v2 (hashed upload — no practical payload size
      # ceiling) instead of the TUF default (Rekor v1), which was rejecting
      # this predicate outright due to size. See "Build Rekor v2 signing
      # config for SBOM attestation" above for full rationale. Requires the
      # cosign-installer v4.x bump above — this flag doesn't exist on the
      # cosign v2.x line the old v3.8.0 installer pin was actually running.
      - name: Attest container image SBOM
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          for PLATFORM in linux/amd64 linux/arm64; do
            FILE="sbom-$(basename "${PLATFORM}").json"

            scripts/cosign-retry.sh cosign attest --yes \
              --type spdxjson \
              --predicate "${FILE}" \
              --signing-config rekor-v2-signing-config.json \
              "${IMG}@${DIGEST}"
          done
      # Post-Publish Verification
      # scripts/verify-image.sh re-implements, from the outside, exactly
      # what a downstream consumer would run to trust this image: keyless
      # signature, SLSA provenance, and SPDX SBOM checks. Runs BEFORE
      # "Create GitHub Release" deliberately — a failure here must block
      # the Release, since there's no point publishing notes for an image
      # that just failed its own trust check. Verified by DIGEST
      # (steps.create-manifest.outputs.digest), not by tag: a tag is a
      # mutable pointer that could move between the sign step and this
      # check; the digest cannot.
      # NOTE (2026-08-23): this step is the practical test of the "Install
      # Cosign CLI tool" step's known open risk (GHCR OCI 1.1 Referrers API
      # support) — see that step's comment. If this fails with something
      # that reads like "no matching signatures/attestations found" rather
      # than a cryptographic/identity mismatch, start there.
      - name: Verify published image signature & attestations
        run: |
          chmod +x scripts/verify-image.sh
          ./scripts/verify-image.sh "${REGISTRY}/${IMAGE_NAME}@${{ steps.create-manifest.outputs.digest }}"

      # ------------------------------------------------------------------------
      # Create GitHub Release with Verification Instructions
      # ------------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          files: config/versions.lock
          generate_release_notes: true
          body: |
            ### Container Pull Directive

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ### Cryptographic Verification Instructions

            ```bash
            # Verify Keyless Signature
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.create-manifest.outputs.digest }}

            # Verify SLSA Provenance Attestation
            cosign verify-attestation \
              --type slsaprovenance1 \
              --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.create-manifest.outputs.digest }}
            ```

      # ------------------------------------------------------------------------
      # Step Summary Output
      # ------------------------------------------------------------------------
      - name: Output Workflow Step Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## BAOBAB Dev Container Published Successfully"
            echo ""
            echo "**OCI Image Reference:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "**Index Manifest Digest:** \`${{ steps.create-manifest.outputs.digest }}\`"
            echo ""
            echo "### Security & Hygiene Controls Applied"
            echo "- ✅ **Pinned GitHub Actions:** Immutable 40-character commit SHAs"
            echo "- ✅ **Concurrency Control:** Auto-cancels obsolete build runs on PRs"
            echo "- ✅ **Trivy CVE Gate:** Passed (0 Critical/High unpatched vulnerabilities)"
            echo "- ✅ **SBOM & SLSA Attestations:** Embedded directly into OCI index"
            echo "- ✅ **Keyless Cosign Signature:** Signed via GitHub Actions OIDC identity"
            echo "- ✅ **Post-Publish Verification:** Signature and attestations independently re-verified against the published digest (scripts/verify-image.sh)"
          } >> "$GITHUB_STEP_SUMMARY"