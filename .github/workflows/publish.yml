# ==============================================================================
# Baobab Enterprise Platform
# Container Image Publish, Attestation & Security Pipeline
#
# File: .github/workflows/publish.yml
#
# ARCHITECTURAL HIGHLIGHTS (Phases 1 & 2):
# -----------------------------------------
# 1. Immutable Action Pinning: All third-party GitHub Actions are pinned to
#    40-character commit SHAs to prevent upstream supply-chain tampering.
# 2. Concurrency Management: Automatically cancels redundant, obsolete runs on
#    active PRs and branches to conserve CI compute time and prevent race conditions.
# 3. Least-Privilege Permissions: Global default set to 'read-only', elevating
#    permissions strictly where needed per job.
# 4. Embedded Supply Chain Metadata:
#    - Native Buildx SPDX SBOM generation (sbom: true)
#    - SLSA Build Provenance attestations (provenance: true)
# 5. Security Gate: Embedded Trivy scanner blocks image releases if unpatched
#    CRITICAL or HIGH severity CVEs are present.
# 6. Keyless OIDC Signing: Cosign uses GitHub's short-lived OIDC identity tokens
#    to sign images and attest supply chain provenance without static secret keys.
#
# CHANGE LOG (this file, most recent first)
# ------------------------------------------------------------------------------
# * sanity-check: lockfile drift on a version-tag push (e.g. v1.0.0) is now a
#   HARD FAILURE instead of an attempted auto-commit. Tags are immutable
#   pointers to an already-reviewed commit; git-auto-commit-action pushing
#   onto a tag ref is not a supported git operation and risks moving the
#   release tag out from under anything already signed/attested against it.
#   Auto-commit is retained, unchanged, for ordinary branch/PR pushes.
# * build/publish: replaced job-level `outputs: digest-amd64/digest-arm64`
#   with the artifact upload/download pattern (per Docker's own documented
#   "Distribute build across multiple runners" approach). Matrix job outputs
#   do not reliably merge per matrix leg in GitHub Actions — depending on
#   completion order, one architecture's digest could be silently dropped at
#   manifest-creation time. Writing each digest to a file and shipping it as
#   a per-arch artifact removes that failure mode entirely, and the new
#   explicit digest-count guard in "Publish multi-architecture OCI manifest"
#   turns any future recurrence into a loud CI failure instead of a subtly
#   broken single-arch manifest.
# ==============================================================================

name: Publish Dev Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (optional)
        required: false
        default: ""

# ------------------------------------------------------------------------------
# Concurrency Management (Phase 2 Hygiene)
# PURPOSE & RATIONALE:
# - Cancels in-flight, superseded workflow runs when new commits are pushed to
#   the same Pull Request or feature branch.
# - Exception: Never auto-cancel builds running on 'main' or git semantic tags
#   to guarantee production deployment trails are never interrupted midway.
# ------------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-dev

# ------------------------------------------------------------------------------
# Least Privilege Global Policy
# RATIONALE: Protect repository state by keeping global token rights strictly read-only.
# ------------------------------------------------------------------------------
permissions:
  contents: read

jobs:

  # ============================================================================
  # Job 1: Pre-flight Lockfile Integrity & Auto-Sync
  # PURPOSE: Verify that config/versions.lock matches config/versions.yaml.
  #          Auto-commits changes back to PR/branch refs if drift is detected.
  #          On a version-tag push, drift is a hard failure instead — see
  #          "Fail on tag-push drift" below.
  # ============================================================================
  sanity-check:
    name: Lockfile Integrity & Auto-Sync
    runs-on: ubuntu-26.04

    # Elevation RATIONALE: Auto-committing resolved lockfiles requires repository
    # write access on ordinary branches. Tag pushes never reach the auto-commit
    # step (see the "Fail on tag-push drift" step below), but the permission is
    # left job-wide rather than step-scoped since GitHub Actions doesn't support
    # per-step permission scoping.
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq dependency
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify lockfile integrity via resolve.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x config/resolve.sh
          ./config/resolve.sh

      - name: Check for lockfile drift
        id: drift-check
        run: |
          if git diff --quiet -- config/versions.lock .python-version; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------------------------
      # Auto-commit resolved lockfile changes — BRANCHES ONLY.
      #
      # RATIONALE: A tag (our v*.*.* release trigger) is meant to be an
      # immutable pointer to an already-reviewed commit. git-auto-commit-action
      # pushing a new commit "onto" a tag ref is not a normal git operation —
      # at best it fails outright and blocks the release tag; at worst it moves
      # the tag, silently invalidating anything already signed/attested against
      # the original commit. This step never runs on a tag push; see the
      # "Fail on tag-push drift" step immediately below for that case instead.
      # -------------------------------------------------------------------------
      - name: Auto-commit resolved lockfile changes (branches only)
        id: auto-commit
        if: steps.drift-check.outputs.drift == 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: stefanzweifel/git-auto-commit-action@8756aa072ef5b4a080af5dc8fef36c5d586e521d # v5.0.0
        with:
          commit_message: "chore(deps): auto-update versions.lock and .python-version via resolve.sh [skip ci]"
          file_pattern: "config/versions.lock .python-version"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      # -------------------------------------------------------------------------
      # Fail on tag-push drift.
      #
      # RATIONALE: There is no branch to auto-commit to on a tag push, and
      # there shouldn't be one — a release tag must be built from exactly the
      # lockfile that was already committed and reviewed (via a normal PR, or
      # via the update-lockfile.yml weekly drift PR). If resolve.sh produces a
      # different versions.lock than what's checked in at this tag, that's a
      # real discrepancy between what versions.yaml now resolves to and what
      # this release is claiming to ship — stop and force a human to reconcile
      # it, rather than silently shipping a mismatched lockfile.
      # -------------------------------------------------------------------------
      - name: Fail on tag-push drift
        if: steps.drift-check.outputs.drift == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error:: config/versions.lock is out of date with config/versions.yaml on tag '${{ github.ref_name }}'."
          echo "::error:: Release tags must be immutable and built from a lockfile that was already committed and reviewed."
          echo "::error:: Run config/resolve.sh locally (or via .github/workflows/update-lockfile.yml), commit the result via a normal PR, then re-cut this tag."
          exit 1

      - name: Enforce pull request branch workflow on auto-commit failure
        if: failure() && steps.auto-commit.outcome == 'failure'
        run: |
          echo "::error:: Lockfile drift detected, but auto-commit failed."
          echo "::error:: Direct pushes to '${{ github.ref_name }}' may be restricted by branch protection."
          echo "::error:: Please execute resolve.sh locally or update via a Pull Request branch."
          exit 1

  # ============================================================================
  # Job 2: Multi-Arch Container Build, Attestations & Vulnerability Scan Gate
  # PURPOSE: Builds architecture-specific images (amd64/arm64), injects SBOM and
  #          SLSA provenance attestations, and scans layers for CVEs via Trivy.
  # ============================================================================
  build:
    name: Build & Security Scan (${{ matrix.platform }})
    needs: sanity-check

    # RATIONALE: Route arm64 builds to native ARM GitHub-hosted runners for faster performance.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    # Elevation RATIONALE: Pushing image layers and metadata by digest requires package write access.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup QEMU Emulation
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI Metadata & Labels
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # ------------------------------------------------------------------------
      # Build image with native Buildx SBOM & SLSA Provenance Attestations
      # RATIONALE:
      # - sbom: true generates SPDX Software Bill of Materials.
      # - provenance: true embeds SLSA Level 3 build provenance into the image index.
      # - push-by-digest: true pushes architecture layers without touching tags yet.
      # ------------------------------------------------------------------------
      - name: Build container image with SBOM & SLSA Provenance
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          sbom: true
          provenance: true

      # ------------------------------------------------------------------------
      # Export architecture image digest to a file, then ship it as a per-arch
      # artifact. RATIONALE: GitHub Actions matrix jobs do not reliably merge
      # job-level `outputs:` across matrix legs — depending on completion
      # order, one architecture's digest can be silently dropped by the time
      # the `publish` job reads `needs.build.outputs.*`. Writing the digest to
      # a file and uploading it as an artifact (Docker's own documented
      # "Distribute build across multiple runners" pattern) removes that
      # failure mode: each leg's digest lands as its own independently
      # retrievable artifact, with no shared mutable state between legs.
      # ------------------------------------------------------------------------
      - name: Export architecture image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # ------------------------------------------------------------------------
      # Security Vulnerability Gate (Trivy)
      # PURPOSE & RATIONALE:
      # Scans the container image for OS and language library vulnerabilities.
      # Fails with exit code 1 if unpatched HIGH or CRITICAL CVEs are detected,
      # preventing vulnerable images from reaching the publish phase.
      # ------------------------------------------------------------------------
      - name: Scan built container with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ------------------------------------------------------------------------
      # Container Smoke Test
      # RATIONALE: Verify basic container runtime health before publishing release tags.
      # ------------------------------------------------------------------------
      - name: Execute container smoke test
        if: matrix.platform == 'linux/amd64' && github.event_name != 'pull_request'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            baobab-verify

  # ============================================================================
  # Job 3: Manifest Creation, OIDC Cosign Signing & Release Attestation
  # PURPOSE: Merges individual architecture images into a unified multi-arch OCI
  #          Index manifest, applies keyless Cosign signatures via OIDC, and creates
  #          a GitHub Release.
  # ============================================================================
  publish:
    name: Publish Multi-Arch Manifest & Cosign Sign
    needs: build
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-24.04

    # --------------------------------------------------------------------------
    # Permission Elevation RATIONALE:
    # - contents: write -> Required to create GitHub Releases and upload release notes.
    # - packages: write -> Required to publish multi-arch OCI index manifests to GHCR.
    # - id-token: write -> CRITICAL for keyless Cosign signing using GitHub OIDC tokens.
    # --------------------------------------------------------------------------
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker tagging metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') && startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # ------------------------------------------------------------------------
      # Download per-architecture digests exported by the build job.
      # merge-multiple: true flattens both `digests-amd64/` and `digests-arm64/`
      # artifact contents into a single directory, so every filename in
      # ${{ runner.temp }}/digests is exactly one architecture's raw sha256
      # (the filename itself IS the digest — see "Export architecture image
      # digest" in the build job).
      # ------------------------------------------------------------------------
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ------------------------------------------------------------------------
      # Merge Architecture Digests into Unified OCI Index Manifest
      # ------------------------------------------------------------------------
      - name: Publish multi-architecture OCI manifest
        id: create-manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && TAG_ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          DIGEST_ARGS=()
          for f in "${{ runner.temp }}/digests"/*; do
            DIGEST_ARGS+=("${IMG}@sha256:$(basename "$f")")
          done

          # Guard against a silently incomplete manifest: fail loudly rather
          # than publishing a "multi-arch" image that only actually supports
          # one architecture.
          if [[ ${#DIGEST_ARGS[@]} -lt 2 ]]; then
            echo "::error:: Expected 2 architecture digests (amd64 + arm64), found ${#DIGEST_ARGS[@]}."
            echo "::error:: Check the 'build' job's per-platform 'Upload digest' steps."
            exit 1
          fi

          # Combine amd64 and arm64 digest layers into a single tag
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${DIGEST_ARGS[@]}"

          # Retrieve final OCI index manifest digest for cryptographic signing
          FIRST_TAG=$(echo "${TAGS}" | head -n1)
          DIGEST=$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # Keyless OIDC Cosign Infrastructure
      # PURPOSE & RATIONALE:
      # Installs Cosign and generates cryptographically signed signatures and
      # supply chain attestations attached directly to the GHCR manifest digest.
      # Eliminates long-lived static private keys in favor of short-lived OIDC tokens.
      # ------------------------------------------------------------------------
      - name: Install Cosign CLI tool
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Sign container image via Keyless OIDC Identity
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "sha=${{ github.sha }}" \
            "${IMG}@${{ steps.create-manifest.outputs.digest }}"

      - name: Attest container image provenance
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          cosign attest --yes \
            --type https://slsa.dev/provenance/v1 \
            -a "repo=${{ github.repository }}" \
            -a "ref=${{ github.ref }}" \
            "${IMG}@${{ steps.create-manifest.outputs.digest }}"

      # ------------------------------------------------------------------------
      # Create GitHub Release with Verification Instructions
      # ------------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          files: config/versions.lock
          generate_release_notes: true
          body: |
            ### Container Pull Directive

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ### Cryptographic Verification Instructions

            ```bash
            # Verify Keyless Signature
            cosign verify \
              --certificate-identity-regexp "^[https://github.com/$](https://github.com/$){{ github.repository_owner }}" \
              --certificate-oidc-issuer "[https://token.actions.githubusercontent.com](https://token.actions.githubusercontent.com)" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.create-manifest.outputs.digest }}

            # Verify SLSA Provenance Attestation
            cosign verify-attestation \
              --type [https://slsa.dev/provenance/v1](https://slsa.dev/provenance/v1) \
              --certificate-identity-regexp "^[https://github.com/$](https://github.com/$){{ github.repository_owner }}" \
              --certificate-oidc-issuer "[https://token.actions.githubusercontent.com](https://token.actions.githubusercontent.com)" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.create-manifest.outputs.digest }}
            ```

      # ------------------------------------------------------------------------
      # Step Summary Output
      # ------------------------------------------------------------------------
      - name: Output Workflow Step Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## BAOBAB Dev Container Published Successfully"
            echo ""
            echo "**OCI Image Reference:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "**Index Manifest Digest:** \`${{ steps.create-manifest.outputs.digest }}\`"
            echo ""
            echo "### Security & Hygiene Controls Applied"
            echo "- ✅ **Pinned GitHub Actions:** Immutable 40-character commit SHAs"
            echo "- ✅ **Concurrency Control:** Auto-cancels obsolete build runs on PRs"
            echo "- ✅ **Trivy CVE Gate:** Passed (0 Critical/High unpatched vulnerabilities)"
            echo "- ✅ **SBOM & SLSA Attestations:** Embedded directly into OCI index"
            echo "- ✅ **Keyless Cosign Signature:** Signed via GitHub Actions OIDC identity"
          } >> "$GITHUB_STEP_SUMMARY"