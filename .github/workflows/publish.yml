# ==============================================================================
# BAOBAB Enterprise Platform
# Container Image Publish, Attestation & Security Pipeline
#
# File: .github/workflows/publish.yml
#
# ARCHITECTURAL HIGHLIGHTS (Phases 1 & 2):
# -----------------------------------------
# 1. Immutable Action Pinning: All third-party GitHub Actions are pinned to
#    40-character commit SHAs to prevent upstream supply-chain tampering.
# 2. Concurrency Management: Automatically cancels redundant, obsolete runs on
#    active PRs and branches to conserve CI compute time and prevent race conditions.
# 3. Least-Privilege Permissions: Global default set to 'read-only', elevating
#    permissions strictly where needed per job.
# 4. Embedded Supply Chain Metadata:
#    - Native Buildx SPDX SBOM generation (sbom: true)
#    - SLSA Build Provenance attestations (provenance: true)
# 5. Shift-Left Security Gate: Embedded Trivy scanner checks every Pull Request,
#    `main` branch push, and release tag to block unpatched CRITICAL/HIGH CVEs
#    or exposed secrets before merging or releasing.
# 6. Keyless OIDC Signing: Cosign uses GitHub's short-lived OIDC identity tokens
#    to sign images and attest supply chain provenance without static secret keys.
# 7. Tag-Gated Release Pipeline: Building and vulnerability scanning are validated
#    on every push and PR, but pushing to the registry, signing, attesting, and
#    releasing only ever happen on an actual `v*.*.*` tag.
#
# PUBLISH & SECURITY TRIGGER POLICY (Phase 3 & 4 Update):
# --------------------------------------------------------
# Shift-Left Security RATIONALE:
# Vulnerability and secret scanning (Trivy) runs on ALL Pull Requests, direct pushes
# to `main`, and release tags. Catching vulnerabilities during PR code review prevents
# "tag pollution" — cutting a `v*.*.*` release tag only to watch CI fail on a CVE forces
# maintainers to delete/re-create immutable git tags or burn patch versions unnecessarily.
#
# Boundary Isolation:
# While Trivy scanning is shifted left to PRs and `main` pushes, registry mutation
# remains gated strictly on tags. `main` pushes and PRs build the image locally
# (`baobab-dev:scan`), scan it, and validate lockfile integrity — nothing is pushed to
# GHCR, signed with Cosign, attested with SLSA, or released as a GitHub Release until
# a maintainer cuts a `v*.*.*` tag.
#
# TRIVY CLI FLAGS:
# ----------------
# `--pkg-types os,library` replaces the deprecated `--vuln-type` flag (Trivy v0.54.0+).
# `--scanners vuln,secret` explicitly gates on both vulnerabilities and secrets.
# `--skip-java-db-update` skips fetching Trivy's ~900 MB Java DB (zero Java in image).
# `--skip-files` excludes Flutter's compiled web SDK bundle from secret scanning.
# `--skip-version-check` disables Trivy's outbound CLI release check.
# ==============================================================================

name: Publish BAOBAB Dev Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (optional)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-dev

permissions:
  contents: read

jobs:

  # ============================================================================
  # Job 1: Pre-flight Lockfile Integrity & Auto-Sync
  # PURPOSE: Verify that config/versions.lock matches config/versions.yaml.
  #          Auto-commits changes back to PR/branch refs if drift is detected.
  # ============================================================================
  sanity-check:
    name: Lockfile Integrity & Auto-Sync
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq dependency
        env:
          YQ_BOOTSTRAP_VERSION: "4.53.3"
          YQ_BOOTSTRAP_SHA256: "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_BOOTSTRAP_VERSION}/yq_linux_amd64"
          echo "${YQ_BOOTSTRAP_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          rm -f /tmp/yq

      - name: Verify lockfile integrity via resolve.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x config/resolve.sh
          ./config/resolve.sh

      - name: Check for lockfile drift
        id: drift-check
        run: |
          if git diff --quiet -- config/versions.lock .python-version; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit resolved lockfile changes (branches only)
        id: auto-commit
        if: steps.drift-check.outputs.drift == 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: stefanzweifel/git-auto-commit-action@8756aa072ef5b4a080af5dc8fef36c5d586e521d # v5.0.0
        with:
          commit_message: "chore(deps): auto-update versions.lock and .python-version via resolve.sh [skip ci]"
          file_pattern: "config/versions.lock .python-version"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fail on tag-push drift
        if: steps.drift-check.outputs.drift == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error:: config/versions.lock is out of date with config/versions.yaml on tag '${{ github.ref_name }}'."
          echo "::error:: Release tags must be immutable and built from a lockfile that was already committed and reviewed."
          echo "::error:: Run config/resolve.sh locally (or via .github/workflows/update-lockfile.yml), commit the result via a normal PR, then re-cut this tag."
          exit 1

      - name: Enforce pull request branch workflow on auto-commit failure
        if: failure() && steps.auto-commit.outcome == 'failure'
        run: |
          echo "::error:: Lockfile drift detected, but auto-commit failed."
          echo "::error:: Direct pushes to '${{ github.ref_name }}' may be restricted by branch protection."
          echo "::error:: Please execute resolve.sh locally or update via a Pull Request branch."
          exit 1

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-lockfile
          path: |
            config/versions.lock
            .python-version
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # Job 2: Multi-Arch Container Build, Attestations & Vulnerability Scan Gate
  # PURPOSE: Builds architecture-specific images (amd64/arm64) and executes
  #          Trivy vulnerability/secret scanning on ALL triggers (PRs, main, tags).
  #          Pushes to GHCR and digest artifact uploads occur strictly on release tags.
  # ============================================================================
  build:
    name: Build & Security Scan (${{ matrix.platform }})
    needs: sanity-check

    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download resolved lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-lockfile
          path: .

      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI Metadata & Labels
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build container image with SBOM & SLSA Provenance
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          sbom: true
          provenance: true

      - name: Export architecture image digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # ------------------------------------------------------------------------
      # Build local single-manifest image for scanning
      # PURPOSE & SHIFT-LEFT RATIONALE:
      # Runs unconditionally on PRs, main pushes, and tag releases.
      # The main build above generates an OCI Index (attestation manifest + image),
      # which causes multi-manifest selection errors if passed directly to Trivy.
      # Exporting a local `load: true` single-manifest image (`baobab-dev:scan`)
      # reuses BuildKit's warm layer cache (0s rebuild cost) and provides an
      # unambiguous scan target for PRs and commits before merging to main.
      # ------------------------------------------------------------------------
      - name: Build local single-manifest image for scanning
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: baobab-dev:scan
          cache-from: type=gha,scope=${{ matrix.platform }}

      # ------------------------------------------------------------------------
      # Cache Trivy vulnerability database
      # PURPOSE: Restores/saves the ~500MB vulnerability DB daily across PRs,
      #          main pushes, and tag release builds to optimize CI runtime.
      # ------------------------------------------------------------------------
      - name: Determine cache date
        id: cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: cache-trivy-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            cache-trivy-

      # ------------------------------------------------------------------------
      # Security Vulnerability Gate (Trivy Installation & Execution)
      # PURPOSE & SHIFT-LEFT RATIONALE:
      # Direct checksummed binary download of Trivy CLI (pinned to v0.73.0).
      # Evaluates `baobab-dev:scan` for OS & language package vulnerabilities and
      # secret leaks. Fails with exit code 1 on HIGH or CRITICAL findings.
      # Executing on PRs and `main` pushes ensures security flaws are caught
      # before code reaches production release tagging.
      # ------------------------------------------------------------------------
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux/amd64) ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; SHA256="2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b" ;;
            linux/arm64) ASSET="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; SHA256="13833d97e8a1a5367471c372a173180157f593bece570e20d5d925fef552f5dd" ;;
            *) echo "::error::Unsupported platform ${{ matrix.platform }} for Trivy install"; exit 1 ;;
          esac

          curl -fsSL -o "${ASSET}" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" trivy
          chmod +x trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan built container with Trivy
        run: |
          trivy image \
            --scanners vuln,secret \
            --skip-java-db-update \
            --skip-files "**/corepack/**,**/cacache/**,**/flutter_web_sdk/**/dart_sdk.js,**/devtools/**" \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-version-check \
            --format table \
            baobab-dev:scan

      - name: Execute container smoke test
        if: matrix.platform == 'linux/amd64' && startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            baobab-verify

  # ============================================================================
  # Job 3: Manifest Creation, OIDC Cosign Signing & Release Attestation
  # PURPOSE: Merges multi-arch images into an OCI Index manifest, signs with
  #          Cosign keyless OIDC, and creates a GitHub Release on `v*.*.*` tags.
  # ============================================================================
  publish:
    name: Publish Multi-Arch Manifest & Cosign Sign
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download resolved lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-lockfile
          path: .

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker tagging metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Publish multi-architecture OCI manifest
        id: create-manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && TAG_ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          DIGEST_ARGS=()
          for f in "${{ runner.temp }}/digests"/*; do
            DIGEST_ARGS+=("${IMG}@sha256:$(basename "$f")")
          done

          if [[ ${#DIGEST_ARGS[@]} -lt 2 ]]; then
            echo "::error:: Expected 2 architecture digests (amd64 + arm64), found ${#DIGEST_ARGS[@]}."
            echo "::error:: Check the 'build' job's per-platform 'Upload digest' steps."
            exit 1
          fi

          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${DIGEST_ARGS[@]}"

          FIRST_TAG=$(echo "${TAGS}" | head -n1)
          DIGEST=$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign CLI tool
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Sign container image via Keyless OIDC Identity
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "sha=${{ github.sha }}" \
            "${IMG}@${{ steps.create-manifest.outputs.digest }}"

      # ------------------------------------------------------------------------
      # Attest Container Image Provenance
      # RATIONALE & FIX FOR COSIGN V3:
      # Removed `-a` (`--annotation`) flags. In Cosign v3, `cosign attest` does
      # NOT support the `-a` shorthand flag (which caused "unknown shorthand flag: 'a' in -a").
      # Under GitHub Actions keyless OIDC, Cosign automatically extracts and embeds
      # the repository, workflow name, commit SHA, and git reference natively into the
      # SLSA provenance predicate bundle from the GitHub OIDC identity token claims.
      # ------------------------------------------------------------------------
      - name: Attest container image provenance
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          cosign attest --yes \
            --type https://slsa.dev/provenance/v1 \
            "${IMG}@${{ steps.create-manifest.outputs.digest }}"

      - name: Verify published image signature & attestations
        run: |
          chmod +x scripts/verify-image.sh
          ./scripts/verify-image.sh "${REGISTRY}/${IMAGE_NAME}@${{ steps.create-manifest.outputs.digest }}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          files: config/versions.lock
          generate_release_notes: true
          body: |
            ### Container Pull Directive

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ### Cryptographic Verification Instructions

            ```bash
            # Verify Keyless Signature
            cosign verify \
              --certificate-identity-regexp "^[https://github.com/$](https://github.com/$){{ github.repository_owner }}" \
              --certificate-oidc-issuer "[https://token.actions.githubusercontent.com](https://token.actions.githubusercontent.com)" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.create-manifest.outputs.digest }}

            # Verify SLSA Provenance Attestation
            cosign verify-attestation \
              --type [https://slsa.dev/provenance/v1](https://slsa.dev/provenance/v1) \
              --certificate-identity-regexp "^[https://github.com/$](https://github.com/$){{ github.repository_owner }}" \
              --certificate-oidc-issuer "[https://token.actions.githubusercontent.com](https://token.actions.githubusercontent.com)" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.create-manifest.outputs.digest }}
            ```

      - name: Output Workflow Step Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## BAOBAB Dev Container Published Successfully"
            echo ""
            echo "**OCI Image Reference:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "**Index Manifest Digest:** \`${{ steps.create-manifest.outputs.digest }}\`"
            echo ""
            echo "### Security & Hygiene Controls Applied"
            echo "- ✅ **Pinned GitHub Actions:** Immutable 40-character commit SHAs"
            echo "- ✅ **Concurrency Control:** Auto-cancels obsolete build runs on PRs"
            echo "- ✅ **Shift-Left Trivy CVE Gate:** Passed on PR, main, and tag checks"
            echo "- ✅ **SBOM & SLSA Attestations:** Embedded directly into OCI index"
            echo "- ✅ **Keyless Cosign Signature:** Signed via GitHub Actions OIDC identity"
            echo "- ✅ **Post-Publish Verification:** Signature and attestations independently re-verified against the published digest (scripts/verify-image.sh)"
          } >> "$GITHUB_STEP_SUMMARY"