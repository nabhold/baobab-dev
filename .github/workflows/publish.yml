name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c4d4f9e6d8a2e7f2e3f3a9a5b6f8d9a6c7e8f9a0 # v3.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@a2f3e4d5c6b7890123456789abcdef1234567890 # v3.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b3c4d5e6f7890123456789abcdef1234567890abc # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push yet)
        uses: docker/build-push-action@c5d6e7f890123456789abcdef1234567890abcd1 # v5.0.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/baobab:test

      - name: Run container tests
        run: |
          docker run --rm ghcr.io/${{ github.repository }}/baobab:test baobab-verify

      - name: Scan image with Grype
        uses: anchore/grype-action@d7e8f90123456789abcdef1234567890abc12345 # v0.20.0
        with:
          image: ghcr.io/${{ github.repository }}/baobab:test
          fail-on-severity: high

      - name: Push verified image
        if: success()
        uses: docker/build-push-action@c5d6e7f890123456789abcdef1234567890abcd1 # v5.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/baobab:latest
            ghcr.io/${{ github.repository }}/baobab:${{ github.ref_name }}

            